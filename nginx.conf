server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 知识库/数据集上传用，给足体积
    client_max_body_size 50m;

    # 后端接口走反向代理，前端代码里的 BASE 就是 /api，不用改一行
    location /api/ {
        proxy_pass http://backend:5274;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/chat/stream 是 SSE 流式对话：关掉缓冲，否则前端一次性卡住不出字
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 前端是 history 模式路由，找不到的路径统统回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存，文件名带 hash 不会过期错乱
    location ~* \.(js|css|woff2?|ttf|png|jpe?g|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
