name: FastAPI Staging rehearsal

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/staging-rehearsal/**'
      - '.github/workflows/staging-rehearsal.yml'

permissions:
  contents: read

jobs:
  rehearsal:
    name: Verify FastAPI through Caddy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: deploy/staging-rehearsal

    steps:
      - name: Check out the rehearsal configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose and Caddy configuration
        run: |
          docker compose config --quiet
          docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Start the published image behind Caddy
        run: docker compose up --detach --wait --wait-timeout 45

      - name: Check the HTTP response through Caddy
        run: |
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --silent --show-error --fail-with-body --retry 8 --retry-connrefused \
            --retry-delay 1 --retry-max-time 20 --max-time 3 --output "$body" \
            --write-out '%{http_code}' http://127.0.0.1:18080/healthz)"
          printf 'Caddy /healthz returned HTTP %s\n' "$status"
          test "$status" = 200
          python3 - "$body" <<'PY'
          import json
          import sys
          from pathlib import Path

          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if response != {"status": "ok"}:
              sys.exit(f"Unexpected health response: {response!r}")
          print("Response body:", json.dumps(response, separators=(",", ":")))
          PY

      - name: Print service diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Clean up the rehearsal
        if: always()
        run: docker compose down --volumes --timeout 5
