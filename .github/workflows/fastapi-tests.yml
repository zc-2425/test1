name: FastAPI tests

on:
  push:
    branches: ['main']
    paths:
      - 'examples/simple-fastapi/**'
      - '.github/workflows/fastapi-tests.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'examples/simple-fastapi/**'
      - '.github/workflows/fastapi-tests.yml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 'examples/simple-fastapi'
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  publish_image:
    name: Publish FastAPI image to GHCR
    needs: pytest
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'zc-2425/test1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: 'ghcr.io/zc-2425/test1-fastapi:sha-${{ github.sha }}'
      BUILD_CONTEXT: 'examples/simple-fastapi'
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE" "$BUILD_CONTEXT"
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push image
        run: docker push "$IMAGE"
